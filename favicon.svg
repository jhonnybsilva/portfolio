<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0f17" />
      <stop offset="100%" stop-color="#151a28" />
    </linearGradient>
    <linearGradient id="stroke-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="45%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <rect x="6" y="6" width="116" height="116" rx="32" fill="url(#bg-grad)" stroke="url(#stroke-grad)" stroke-width="5" />
  
  <!-- Subtle ambient glow circle -->
  <circle cx="64" cy="64" r="32" fill="#6366f1" opacity="0.18" />

  <!-- Letter J -->
  <text x="64" y="93" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="86" 
        font-weight="900" 
        fill="url(#brand-grad)" 
        text-anchor="middle">J</text>

  <!-- Cyan Tech/Data Node Dot -->
  <circle cx="96" cy="32" r="7" fill="#06b6d4" />
  <circle cx="96" cy="32" r="2.5" fill="#ffffff" opacity="0.9" />
</svg>